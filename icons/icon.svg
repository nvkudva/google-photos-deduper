<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Photo DeDuper">
  <title>Photo DeDuper</title>
  <!-- Source of truth for every icon size. The PNGs in this folder are
       rasterised from this file by tools/rasterize.py; edit the SVG, never a
       PNG. Flat fills only, no gradient and no shadow: the mark has to survive
       being drawn 16 pixels wide. -->
  <defs>
    <!-- The tile. A superellipse rather than a rounded rectangle: the corner
         curvature runs on continuously instead of stopping dead at the arc. -->
    <path id="tile" d="M64 2
      C 96.5 2 103.4 3.6 111.2 11.4 S 126 31.5 126 64
        126 96.5 118.2 111.2 96.5 126 64 126
        31.5 126 20.8 118.2 6.8 96.5 2 64
        3.6 31.5 11.4 20.8 31.5 2 64 2 Z"/>
    <!-- One swept blade, pointing up from the hub. Every other blade is this
         one rotated, so the sweep stays identical all the way round. -->
    <path id="blade" d="M64 66
      C 45.5 53 41.5 27 61 12.5
      C 83 20 80 48 64 66 Z"/>
  </defs>

  <use href="#tile" fill="#ffffff"/>
  <use href="#tile" fill="none" stroke="#e8eaed" stroke-width="2"/>

  <g transform="translate(64 66) scale(1.1) translate(-64 -66)">
    <use href="#blade" fill="#ea4335"/>
    <use href="#blade" fill="#34a853" transform="rotate(45 64 66)"/>
    <use href="#blade" fill="#4285f4" transform="rotate(90 64 66)"/>
    <use href="#blade" fill="#fa7b17" transform="rotate(135 64 66)"/>
    <use href="#blade" fill="#4285f4" transform="rotate(180 64 66)"/>
    <use href="#blade" fill="#fbbc04" transform="rotate(225 64 66)"/>
    <use href="#blade" fill="#f9ab00" transform="rotate(270 64 66)"/>
    <use href="#blade" fill="#fa7b17" transform="rotate(315 64 66)"/>
  </g>

  <!-- The tick is what makes this a deduper rather than a gallery: one copy
       kept. Drawn last, in white, so it holds at 16px over any blade. -->
  <path d="M47 67.5 L59.5 80.5 L88 46" fill="none" stroke="#ffffff" stroke-width="12.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
